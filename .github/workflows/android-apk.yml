name: Build ManiHub Android APK (website v1)

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/website-v1
    paths:
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: manihub-android-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build Android debug APK from ManiHub website v1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the new ManiHub website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the exact shared website used by the new app
        run: npm run build

      - name: Add Android platform and package the website
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate ManiHub launcher icons from the original app artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          set -euo pipefail
          test -s assets/manihub-logo-transparent.png
          # Use the approved ManiHub artwork as a full-bleed legacy launcher icon.
          # Remove generated adaptive XML so Android uses these verified PNG resources.
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for spec in 'mipmap-mdpi:48' 'mipmap-hdpi:72' 'mipmap-xhdpi:96' 'mipmap-xxhdpi:144' 'mipmap-xxxhdpi:192'; do
            folder="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/$folder"
            convert -size "${size}x${size}" xc:"#003b25" \( assets/manihub-logo-transparent.png -resize "${size}x${size}" \) -gravity center -composite -alpha remove -alpha off "android/app/src/main/res/$folder/ic_launcher.png"
          done

      - name: Assemble installable Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload ManiHub v1 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ManiHub-Android-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
