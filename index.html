ce</div><div class="auth-heading"><h1 id="authHeading">Welcome back</h1><p id="authSubheading">Sign in to your ManiHub account</p></div><div id="authStatus" class="auth-status" aria-live="polite">Sign in or create an account to shop, sell and connect with local businesses.</div><div id="authNameWrap" class="auth-field" hidden><label for="authName">Your name</label><div class="auth-input-wrap"><span>♙</span><input id="authName" type="text" placeholder="Your full name" autocomplete="name"></div></div><div class="auth-field"><label for="authIdentifier">Cellphone number or email address</label><div class="auth-input-wrap"><span>☎</span><input id="authIdentifier" type="text" placeholder="082 123 4567 or you@example.com" autocomplete="username"></div></div><div class="auth-field"><label for="authPassword">Password</label><div class="auth-input-wrap"><span>▣</span><input id="authPassword" type="password" placeholder="Enter your password" autocomplete="current-password"><button type="button" class="auth-eye" onclick="togglePasswordVisibility()" aria-label="Show or hide password">◉</button></div></div><div class="auth-forgot"><button type="button" onclick="forgotPassword()">Forgot password?</button></div><button type="button" class="auth-submit" id="authSubmit" onclick="signInUser()">Sign in</button><div class="auth-divider"><span>or</span></div><div class="auth-switch" id="authSwitch">Don't have an account? <button type="button" onclick="toggleAuthMode()">Create an account</button></div><div id="passwordRecovery" class="auth-recovery" hidden><label for="newPassword">Choose a new password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="New password (at least 6 characters)"><button type="button" class="auth-submit" onclick="saveNewPassword()">Save new password</button></div></div></section><div class="auth-footer">One Hub. Everything you need. · South Africa</div></div><script>
let supabaseClient = null;
const SUPABASE_URL = "https://oochtzrlpylesoqvtikg.supabase.co";
const SUPABASE_KEY = "sb_publishable_0l4I1Ypz8cVOL6d-GP0O5Q_airms5jD";
const cats = ["All","Electronics","Clothing","Home & Furniture","Food","Beauty","Vehicles","Services","Other"];
const departmentFilters = {
  shopping:["Electronics","Home & Furniture","Food","Other"],

let active = "All", activeDepartment = "all", listings = [], currentUser = null;
function byId(id){ return document.getElementById(id); }
function setStatus(message){ const el=byId("authStatus"); if(el) el.textContent=message; }
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function mapListing(x){return {id:x.id,created_at:x.created_at||"",item:x.title,price:Number(x.price),category:x.category,kind:x.seller_type==="business"?"Registered business":"Individual seller",seller:x.seller_name,province:x.province,town:x.town||"",phone:x.whatsapp||"",description:x.description||"",photo:x.photo_url||"",emoji:"🛍️"};}
function renderCats(){const el=byId("categories"); if(!el)return; el.innerHTML=cats.map(c=>`<button type="button" class="chip ${active===c?'active':''}" data-category="${esc(c)}">${esc(c)}</button>`).join("");}
function setCat(c){active=c;activeDepartment="all";render();}
function showListingResults(){

function showHeroSlide(index){

    {image:"https://images.unsplash.com/photo-1607082349566-187342175e2f?auto=format&fit=crop&w=1500&q=85",kicker:"SUPPORT LOCAL BUSINESSES",title:"Discover.",highlight:"Something Great!",sub:"Find local shops · Compare · Connect"},

function setDepartment(department){
  activeDepartment=department;
  active="All";
  const messages={
    shopping:"Shopping & groceries selected. Browse available food, household and electronics listings.",
    health:"Healthcare is part of the ManiHub all-in-one plan. Professional profiles and appointment booking are coming in a future build.",
    legal:"Legal services are part of the ManiHub all-in-one plan. Verified professional profiles and consultations are coming in a future build.",
    fashion:"Fashion & clothing selected. Browse clothing listings and discover local makers.",
    local:"Local services selected. Browse service, beauty and vehicle-related listings.",
    restaurants:"Restaurants & takeaways selected. Browse available food listings; restaurant menus and ordering are a future build.",
    delivery:"ManiHub delivery will connect to eligible orders. Delivery checkout and live distance quotes are a future build.",
    all:"Showing all available ManiHub listings."
  };
  const status=byId("departmentStatus");if(status)status.textContent=messages[department]||messages.all;
  showListingResults();
  if(department==="health"||department==="legal"){
    const target=byId("listings");
    if(target)target.innerHTML='<div class="empty"><div style="font-size:35px">'+(department==="health"?"🩺":"⚖️")+'</div><b>'+(department==="health"?"Healthcare directory coming soon":"Legal services directory coming soon")+'</b><p>We are preparing verified professional profiles and safe appointment or consultation requests for this department.</p></div>';
    byId("count").textContent="Department preview";
  }else{render();}
  document.querySelector(".listing-discovery")?.scrollIntoView({behavior:"smooth",block:"start"});
  return;
  document.querySelectorAll("[data-department]").forEach(b=>b.classList.toggle("active",b.dataset.department===department));
  render();
}
function render(){
  renderCats();renderHotProducts();if(!byId("explorePage")?.hidden)renderExploreListings(); const search=byId("search"),province=byId("province"),target=byId("listings"); if(!search||!province||!target)return;
  const q=search.value.trim().toLowerCase(),p=province.value;
  const deptFilter=departmentFilters[activeDepartment];
  const shown=listings.filter(x=>(active==="All"||x.category===active)&&(!deptFilter||deptFilter.includes(x.category))&&(!p||x.province===p)&&(!q||[x.item,x.category,x.seller,x.town,x.province,x.description].join(" ").toLowerCase().includes(q)));
  byId("count").textContent=`${shown.length} listing${shown.length===1?"":"s"} found`;
  target.innerHTML=shown.length?shown.map(x=>{const wa=String(x.phone||"").replace(/\D/g,"");const msg=encodeURIComponent(`Hi ${x.seller}, I saw your "${x.item}" advert on ManiHub. Is it still available?`);return `<article class="card"><div class="photo">${x.photo?`<img src="${esc(x.photo)}" alt="${esc(x.item)}">`:esc(x.emoji)}</div><div class="cardbody"><div class="meta">${esc(x.category)} · ${esc(x.kind)}</div><div class="title">${esc(x.item)}</div><div class="price">R${Number(x.price).toLocaleString("en-ZA",{maximumFractionDigits:2})}</div><div class="seller">${esc(x.seller)}</div><div class="meta">📍 ${esc(x.town?x.town+", ":"")}${esc(x.province)}</div><div class="cardactions">${wa?`<a href="https://wa.me/${wa}?text=${msg}" target="_blank" rel="noopener">WhatsApp seller</a>`:`<span class="meta">No contact supplied</span>`}<button type="button" data-details="${esc(x.id)}">Details</button></div></div></article>`}).join(""):`<div class="empty"><div style="font-size:35px">🔎</div><b>No listings found</b><p>${supabaseClient?"There are no matching live adverts yet. Create an account and post the first one.":"Marketplace connection is not ready. Please refresh the page and try again."}</p><button type="button" class="secondary" data-open-form>Post an advert</button></div>`;
}


let listingPopularity={};
let maniVisitorId=null;
function getManiVisitorId(){
  try{
    maniVisitorId=localStorage.getItem("manihub_visitor_id");
    if(!maniVisitorId){maniVisitorId=crypto.randomUUID();localStorage.setItem("manihub_visitor_id",maniVisitorId);}
  }catch(e){maniVisitorId=crypto.randomUUID();}
  return maniVisitorId;
}
async function recordListingEvent(listingId,eventType){
  if(!supabaseClient||!listingId)return;
  try{
    const {error}=await supabaseClient.rpc("manihub_record_listing_engagement",{
      p_listing_id:String(listingId),p_event_type:eventType,p_visitor_id:getManiVisitorId()
    });
    if(error)throw error;
    await refreshListingPopularity();
  }catch(error){console.info("ManiHub engagement tracking is awaiting its database migration.",error.message||error);}
}
async function refreshListingPopularity(){
  if(!supabaseClient)return;
  try{
    const {data,error}=await supabaseClient.rpc("manihub_get_listing_popularity");
    if(error)throw error;
    listingPopularity={};
    (data||[]).forEach(row=>{listingPopularity[String(row.listing_id)]={
      views:Number(row.views_30d||0),saves:Number(row.saves_30d||0),
      enquiries:Number(row.enquiries_30d||0),sales:Number(row.sales_30d||0),
      score:Number(row.popularity_score||0)
    };});
    renderHotProducts();
    if(!byId("explorePage")?.hidden)renderExploreListings();
  }catch(error){console.info("ManiHub popularity stats are not connected yet.",error.message||error);}
}
function getListingScore(x){return listingPopularity[String(x.id)]?.score||0;}
function getListingBadge(x){
  const stats=listingPopularity[String(x.id)]||{};
  if(stats.sales>0)return "🏆 Best seller";
  if(stats.enquiries>=3||stats.saves>=3)return "🔥 Trending";
  if(stats.score>0)return "⭐ Popular";
  return "✦ Just added";
}
function isListingSaved(id){
  try{return JSON.parse(localStorage.getItem("manihub_saved_listings")||"[]").includes(String(id));}catch(e){return false;}
}
async function toggleListingSave(id){
  let saved=[];try{saved=JSON.parse(localStorage.getItem("manihub_saved_listings")||"[]");}catch(e){}
  const key=String(id),already=saved.includes(key);
  if(already)saved=saved.filter(x=>x!==key);else saved.push(key);
  try{localStorage.setItem("manihub_saved_listings",JSON.stringify(saved));}catch(e){}
  if(!already)await recordListingEvent(id,"save");
  const button=byId("saveListingButton");
  if(button){button.textContent=already?"♡ Save":"♥ Saved";button.classList.toggle("saved",!already);}
}

let exploreCategory="All",exploreMode="products",manihubStores=[];
function setExploreMode(mode){
  exploreMode=mode==="stores"?"stores":"products";
  const products=exploreMode==="products";
  byId("productsMode")?.classList.toggle("active",products);
  byId("storesMode")?.classList.toggle("active",!products);
  byId("productsMode")?.setAttribute("aria-selected",String(products));
  byId("storesMode")?.setAttribute("aria-selected",String(!products));
  byId("exploreProductsPanel").hidden=!products;
  byId("exploreStoresPanel").hidden=products;
  if(!products)loadManiHubStores();else renderExploreListings();
}
function openStoreForm(){
  if(!currentUser){openAuth();return;}
  byId("storeModal")?.classList.add("open");
}
function closeStoreForm(){byId("storeModal")?.classList.remove("open");}
function closeStoreDetails(){byId("storeDetailsModal")?.classList.remove("open");}
async function loadManiHubStores(){
  const target=byId("exploreStores");if(!target)return;
  if(!supabaseClient){target.innerHTML='<div class="hot-empty">Store directory connection is not ready. Please refresh and try again.</div>';return;}
  target.innerHTML='<div class="hot-empty">Loading local stores…</div>';
  try{
    const {data,error}=await supabaseClient.from("manihub_stores").select("id,owner_id,store_name,description,category,province,town,whatsapp,logo_url,banner_url,promo_video_url,created_at").eq("status","active").order("created_at",{ascending:false}).limit(100);
    if(error)throw error;
    manihubStores=data||[];renderExploreStores();
  }catch(error){
    target.innerHTML='<div class="hot-empty">The store directory is waiting for its database setup. Apply the ManiHub storefront migration in Supabase, then refresh this page.</div>';
    console.info("ManiHub storefront database is not ready yet.",error.message||error);
  }
}
function renderExploreStores(){
  const target=byId("exploreStores");if(!target)return;
  const q=(byId("exploreSearch")?.value||"").trim().toLowerCase();
  const categoryMatch=x=>{
    if(exploreCategory==="All")return true;
    const aliases={"Clothing":["fashion"],"Food":["food","restaurant","grocery"],"Home & Furniture":["home"],"Services":["service"],"Beauty":["beauty"],"Healthcare":["health"],"Legal services":["legal"],"Vehicles":["vehicle"],"Electronics":["electronic"],"Other":["other"]};
    const terms=aliases[exploreCategory]||[exploreCategory.toLowerCase()];
    return terms.some(term=>String(x.category||"").toLowerCase().includes(term));
  };
  const found=manihubStores.filter(x=>exploreCategoryMatches(x.category,exploreCategory)&&[x.store_name,x.description,x.category,x.town,x.province].join(" ").toLowerCase().includes(q));
  target.innerHTML=found.length?found.map(x=>'<article class="store-card" role="button" tabindex="0" onclick="openStoreDetails(\''+esc(x.id)+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openStoreDetails(\''+esc(x.id)+'\')}"><div class="store-card-top"><span class="store-avatar">'+(x.logo_url?'<img src="'+esc(x.logo_url)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:15px">':'🏬')+'</span><b>'+esc(x.store_name)+'</b></div><div class="store-card-body"><span class="store-card-meta">'+esc(x.category)+' · '+esc(x.town?x.town+", ":"")+esc(x.province)+'</span><p>'+esc(x.description||"Discover this local ManiHub business.")+'</p><span class="store-open-label">View storefront →</span></div></article>').join(""):'<div class="hot-empty">No stores have opened on ManiHub yet. Be the first business to create a store.</div>';
}
async function openStoreDetails(id){
  const store=manihubStores.find(x=>String(x.id)===String(id));if(!store)return;
  const phone=String(store.whatsapp||"").replace(/\D/g,"");
  const message=encodeURIComponent("Hello "+store.store_name+", I found your store on ManiHub.");
  const content=byId("storeDetailsContent");
  content.innerHTML='<div class="store-profile-intro"><div style="font-size:34px">🏬</div><h2 style="color:white;margin:7px 0">'+esc(store.store_name)+'</h2><span>'+esc(store.category)+'</span><p>'+esc(store.description||"This business has not added its description yet.")+'</p></div><div class="store-profile-meta">📍 '+esc(store.town?store.town+", ":"")+esc(store.province)+'</div><div class="note">This storefront profile is active. Product catalogue, stock controls, store photos and promotional videos are the next build stage.</div><div class="detail-contact">'+(phone?'<a class="whatsapp" href="https://wa.me/'+phone+'?text='+message+'" target="_blank" rel="noopener">Contact business</a>':'')+'<button type="button" class="secondary" onclick="closeStoreDetails()">Close</button></div>';
  byId("storeDetailsTitle").textContent=store.store_name;
  byId("storeDetailsModal")?.classList.add("open");
}
async function createManiHubStore(event){
  event.preventDefault();
  if(!currentUser||!supabaseClient){openAuth();return;}
  const required=[["storeName","Enter your store name."],["storeCategory","Choose a business category."],["storeProvince","Choose your province."]];
  for(const [id,message] of required){const el=byId(id);if(!el.value.trim()){alert(message);el.focus();return;}}
  const button=byId("createStoreButton");button.disabled=true;button.textContent="Creating store…";
  try{
    const {error}=await supabaseClient.from("manihub_stores").insert({
      owner_id:currentUser.id,store_name:byId("storeName").value.trim(),
      category:byId("storeCategory").value,province:byId("storeProvince").value,
      town:byId("storeTown").value.trim(),whatsapp:byId("storeWhatsApp").value.trim(),
      description:byId("storeDescription").value.trim(),status:"active"
    });
    if(error)throw error;
    byId("storeForm").reset();closeStoreForm();await loadManiHubStores();setExploreMode("stores");
    alert("Your ManiHub store has been created. Next we can add its catalogue, photos, videos and stock controls.");
  }catch(error){alert("Could not create your store: "+(error.message||error));}
  finally{button.disabled=false;button.textContent="Create my store";}
}

function productCardMarkup(x,compact=false){
  const image=x.photo?'<img src="'+esc(x.photo)+'" alt="'+esc(x.item)+'" loading="lazy">':"🛍️";
  const location=(x.town?x.town+", ":"")+x.province;
  const price="R"+Number(x.price).toLocaleString("en-ZA",{maximumFractionDigits:2});
  if(compact)return '<article class="hot-product" role="button" tabindex="0" onclick="showDetails(\''+esc(x.id)+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();showDetails(\''+esc(x.id)+'\')}"><div class="hot-product-photo">'+image+'</div><div class="hot-product-body"><span class="hot-product-badge">'+getListingBadge(x)+'</span><div class="hot-product-title">'+esc(x.item)+'</div><div class="hot-product-price">'+price+'</div><div class="hot-product-location">📍 '+esc(location)+'</div></div></article>';
  return '<article class="explore-product" role="button" tabindex="0" onclick="showDetails(\''+esc(x.id)+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();showDetails(\''+esc(x.id)+'\')}"><div class="explore-product-photo">'+image+'</div><div class="explore-product-body"><small>'+esc(x.category)+' · '+esc(location)+'</small><b>'+esc(x.item)+'</b><strong>'+price+'</strong><small>Seller: '+esc(x.seller)+'</small></div></article>';
}
function renderHotProducts(){
  const target=byId("hotProducts");if(!target)return;
  const fresh=[...listings].sort((a,b)=>getListingScore(b)-getListingScore(a)||new Date(b.created_at||0)-new Date(a.created_at||0)).slice(0,8);
  target.innerHTML=fresh.length?fresh.map(x=>productCardMarkup(x,true)).join(""):'<div class="hot-empty">New products will appear here as soon as sellers publish adverts. <button type="button" class="secondary" onclick="openForm()">Be the first to sell</button></div>';
}
function showExploreView(reset=true){
  const main=document.querySelector("main");
  const explore=byId("explorePage");
  if(!explore)return;
  if(main&&explore&&main.firstElementChild!==explore)main.insertBefore(explore,main.firstElementChild);
  document.body.classList.add("exploring");
  closeManiMenu();
  document.querySelectorAll("main > section").forEach(section=>{section.hidden=section.id!=="explorePage";});
  byId("explorePage").hidden=false;
  if(reset){exploreCategory="All";byId("exploreSearch").value="";
    document.querySelectorAll("[data-explore-category]").forEach(b=>b.classList.toggle("active",b.dataset.exploreCategory==="All"));
    setExploreMode("products");
  }
  renderExploreListings();
  window.scrollTo({top:0,behavior:"instant"});
}

function exploreCategoryMatches(value,category){
  if(category==="All")return true;
  const groups={
    "Shopping & groceries":["food","grocery","shopping","household","home"],
    "Electronics":["electronic","computer","phone","appliance"],
    "Clothing":["clothing","fashion","apparel"],
    "Home & Furniture":["home","furniture","decor"],
    "Food":["food","restaurant","grocery"],
    "Healthcare":["health","medical","beauty"],
    "Beauty":["beauty","personal care"],
    "Vehicles":["vehicle","car","motor"],
    "Legal services":["legal","law"],
    "Services":["service","repair","plumb","electric"],
    "Other":["other"]
  };
  const terms=groups[category]||[category.toLowerCase()];
  return terms.some(term=>String(value||"").toLowerCase().includes(term));
}

async function refreshAuth(){
  if(!supabaseClient){setStatus("Connection service is not ready yet. Please refresh ManiHub; if it persists, tell us.");return;}
  try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;currentUser=data.session?.user||null;
      document.body.classList.toggle("authenticated",!!currentUser);syncHeaderActions();setStatus(currentUser?`Signed in as ${currentUser.email}. You can publish adverts.`:"Sign in or create an account to publish adverts to the shared marketplace.");}
  catch(error){setStatus("Account connection error: "+(error.message||error));}
}
async function signUpUser(){
  if(!supabaseClient){alert("ManiHub's connection service has not loaded. Refresh the page and try again.");return;}
  const name=byId("authName").value.trim(),identifier=byId("authIdentifier").value.trim(),password=byId("authPassword").value;
  if(!name||!identifier||password.length<6){alert("Enter your name, cellphone number or email address, and a password of at least 6 characters.");return;}
  const isEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier);
  const phone=normalizeSouthAfricanPhone(identifier);
  if(!isEmail&&!phone){alert("Enter a valid email address or South African cellphone number (for example 082 123 4567 or +27 82 123 4567).");return;}
  try{
    const credentials=isEmail?{email:identifier,password,options:{data:{display_name:name}}}:{phone,password,options:{data:{display_name:name}}};
    const {data,error}=await supabaseClient.auth.signUp(credentials);if(error)throw error;
    if(data.session){currentUser=data.user;await refreshAuth();window.location.assign(new URL("marketplace/",window.location.href).href);}
    else{alert(isEmail?"Registration started. Check your email for a confirmation link, then sign in.":"Registration started. Check your SMS for a verification code. Phone sign-up requires SMS authentication to be enabled for this ManiHub project.");}
  }catch(error){alert("Could not create account: "+(error.message||error));}
}
function normalizeSouthAfricanPhone(value){
  let digits=String(value||"").replace(/[\s().-]/g,"");
  if(/^0[6-8]\d{8}$/.test(digits))digits="+27"+digits.slice(1);
  else if(/^27[6-8]\d{8}$/.test(digits))digits="+"+digits;
  else if(/^\\+27[6-8]\d{8}$/.test(digits)){}
  else return null;
  return digits;
}

  async function signInUser(){

  const identifier=byId("authIdentifier").value.trim(),password=byId("authPassword").value;
  if(!identifier||!password){alert("Enter your cellphone number or email address and password.");return;}

  }catch(error){alert("Could not sign in: "+(error.message||error));}

function validateListingForm(){
  const checks=[
    ["item","Enter your product or service name."],
    ["price","Enter the price in rand."],
    ["category","Choose a category."],
    ["seller","Enter your name or business name."],
    ["provinceInput","Choose your province."],
    ["phone","Enter your WhatsApp number with country code."]
  ];
  let firstInvalid=null;
  checks.forEach(([id,message])=>{
    const input=byId(id),field=input?.closest(".field");
    if(!input||!field)return;
    let error=field.querySelector(".field-error");
    if(!error){error=document.createElement("small");error.className="field-error";error.id=id+"Error";error.setAttribute("role","alert");field.appendChild(error);}
    const invalid=!String(input.value||"").trim();
    input.setAttribute("aria-invalid",invalid?"true":"false");
    error.textContent=invalid?message:"";error.hidden=!invalid;
    if(invalid&&!firstInvalid)firstInvalid=input;
  });
  const price=byId("price");
  if(price&&price.value.trim()&&Number(price.value)<0){
    const field=price.closest(".field"),error=field.querySelector(".field-error");
    error.textContent="Price cannot be negative.";error.hidden=false;price.setAttribute("aria-invalid","true");
    if(!firstInvalid)firstInvalid=price;
  }
  if(firstInvalid){const target=firstInvalid.closest(".field")||firstInvalid;target.scrollIntoView({behavior:"auto",block:"center"});firstInvalid.focus({preventScroll:true});return false;}
  return true;
}
async function publishListing(e){
  e.preventDefault();
  if(!validateListingForm())return;
  if(!supabaseClient){alert("ManiHub's connection service has not loaded. Refresh the page and try again.");return;}
  if(!currentUser){alert("Please sign in first.");return;}
  const file=byId("photo").files[0];
  if(file && !["image/jpeg","image/png","image/webp"].includes(file.type)){alert("Please choose a JPG, PNG or WebP image.");return;}
  if(file && file.size>15*1024*1024){alert("Your photo must be 15 MB or smaller.");return;}
  const button=byId("publishButton");if(button){button.disabled=true;button.textContent="Publishing…";}
  let uploadedPath=null;
  try{
    let photoUrl=null;
    if(file){
      const ext=({ "image/jpeg":"jpg","image/png":"png","image/webp":"webp" })[file.type];
      uploadedPath=currentUser.id+"/"+crypto.randomUUID()+"."+ext;
      const {error:uploadError}=await supabaseClient.storage.from("listing-photos").upload(uploadedPath,file,{cacheControl:"3600",upsert:false,contentType:file.type});
      if(uploadError)throw new Error("Photo upload failed: "+uploadError.message+". Check that the listing-photos storage bucket and upload policy have been created.");
      const {data:urlData}=supabaseClient.storage.from("listing-photos").getPublicUrl(uploadedPath);
      photoUrl=urlData.publicUrl;
    }
    const kind=byId("kind").value;
    const row={owner_id:currentUser.id,title:byId("item").value.trim(),price:Number(byId("price").value),category:byId("category").value,seller_type:kind==="Registered business"?"business":"individual",seller_name:byId("seller").value.trim(),province:byId("provinceInput").value,town:byId("town").value.trim()||null,whatsapp:byId("phone").value.trim(),description:byId("description").value.trim(),photo_url:photoUrl,status:"active"};
    const {error}=await supabaseClient.from("listings").insert(row);if(error)throw error;
    e.target.reset();const preview=byId("photoPreview");if(preview){preview.src="";preview.hidden=true;}
    closeForm();byId("province").value="";active="All";await refreshListings();alert("Your advert has been published to ManiHub.");
  }catch(error){
    if(uploadedPath){try{await supabaseClient.storage.from("listing-photos").remove([uploadedPath]);}catch(cleanupError){}}
    alert("Could not publish advert: "+(error.message||error));
  }finally{if(button){button.disabled=false;button.textContent="Publish advert";}}
}
function previewListingPhoto(){
  const input=byId("photo"),preview=byId("photoPreview");if(!input||!preview)return;
  const file=input.files&&input.files[0];if(!file){preview.hidden=true;preview.removeAttribute("src");return;}
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>15*1024*1024){preview.hidden=true;preview.removeAttribute("src");return;}
  preview.src=URL.createObjectURL(file);preview.hidden=false;
}

function helpEscape(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function loadHelpConversations(){
  const list=byId("helpConversationList"),input=byId("helpInput"),send=byId("helpSend");
  if(!currentUser||!supabaseClient){helpStatus("Please sign in to start a private support conversation.");if(input)input.disabled=true;if(send)send.disabled=true;if(list)list.innerHTML='<p class="meta">Sign in to view your conversations.</p>';return;}
  helpStatus("Your private ManiHub support conversations.");
  if(input)input.disabled=!activeHelpConversation;if(send)send.disabled=!activeHelpConversation;
  try{
    const {data:parts,error}=await supabaseClient.from("manihub_conversation_participants").select("conversation_id").eq("user_id",currentUser.id);
    if(error)throw error;
    const ids=[...new Set((parts||[]).map(p=>p.conversation_id))];
    if(!ids.length){list.innerHTML='<p class="meta">No conversations yet. Start a private support conversation.</p><button type="button" class="primary" onclick="startHelpConversation()">＋ New support conversation</button>';return;}
    const {data:conversations,error:convError}=await supabaseClient.from("manihub_conversations").select("id,subject,conversation_type,status,updated_at").in("id",ids).order("updated_at",{ascending:false});
    if(convError)throw convError;
    list.innerHTML='<button type="button" class="primary" onclick="startHelpConversation()">＋ New support conversation</button>'+((conversations||[]).map(c=>'<button type="button" class="secondary" style="display:block;width:100%;text-align:left;margin-top:7px" onclick="openHelpConversation(\''+helpEscape(c.id)+'\')">'+helpEscape(c.subject||"ManiHub support")+' · '+helpEscape(c.status)+'</button>').join(""));
  }catch(error){helpStatus("Could not load conversations: "+(error.message||error));}
}
async function startHelpConversation(){
  if(!currentUser||!supabaseClient){openAuth();return;}
  try{
    const conversationId=crypto.randomUUID();
    const {error}=await supabaseClient.from("manihub_conversations").insert({id:conversationId,conversation_type:"support",subject:"ManiHub support",created_by:currentUser.id});
    if(error)throw error;
    const {error:participantError}=await supabaseClient.from("manihub_conversation_participants").insert({conversation_id:conversationId,user_id:currentUser.id,participant_role:"member"});
    if(participantError)throw participantError;
    activeHelpConversation=conversationId;
    await loadHelpConversations();await openHelpConversation(conversationId);
  }catch(error){helpStatus("Could not start conversation: "+(error.message||error));}
}
async function openHelpConversation(id){
  if(!currentUser||!supabaseClient)return;
  activeHelpConversation=id;
  const list=byId("helpConversationList"),messages=byId("helpMessageList"),input=byId("helpInput"),send=byId("helpSend");
  if(list)list.style.display="none";if(messages)messages.style.display="block";
  if(input)input.disabled=false;if(send)send.disabled=false;
  if(helpRealtime){supabaseClient.removeChannel(helpRealtime);helpRealtime=null;}
  await refreshHelpMessages();
  helpRealtime=supabaseClient.channel("manihub-chat-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"manihub_messages",filter:"conversation_id=eq."+id},payload=>appendHelpMessage(payload.new)).subscribe();
  helpStatus("Conversation opened. Messages are private to its participants.");
}
function appendHelpMessage(m){
  const box=byId("helpMessageList");if(!box||!m)return;
  if(box.querySelector('[data-message-id="'+helpEscape(m.id)+'"]'))return;
  const row=document.createElement("div");row.dataset.messageId=m.id;row.style.cssText="padding:9px 11px;margin:7px 0;border-radius:12px;background:"+(m.sender_id===currentUser?.id?"#eaf4e7":"#f1f4f1")+";font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere";
  row.innerHTML='<small style="display:block;color:#66736d;margin-bottom:3px">'+(m.sender_id===currentUser?.id?"You":"ManiHub support")+'</small>'+helpEscape(m.body);
  box.appendChild(row);box.scrollTop=box.scrollHeight;
}
async function refreshHelpMessages(){
  const box=byId("helpMessageList");if(!box||!activeHelpConversation)return;
  try{const {data,error}=await supabaseClient.from("manihub_messages").select("id,sender_id,body,created_at").eq("conversation_id",activeHelpConversation).order("created_at",{ascending:true}).limit(200);if(error)throw error;box.innerHTML="";(data||[]).forEach(appendHelpMessage);}
  catch(error){helpStatus("Could not load messages: "+(error.message||error));}
}
async function submitHelpMessage(event){
  event.preventDefault();
  const input=byId("helpInput"),send=byId("helpSend"),body=input?.value.trim();
  if(!body||!activeHelpConversation||!currentUser)return;
  send.disabled=true;
  try{
    const {error}=await supabaseClient.from("manihub_messages").insert({conversation_id:activeHelpConversation,sender_id:currentUser.id,body});
    if(error)throw error;
    input.value="";
  }catch(error){helpStatus("Message could not be sent: "+(error.message||error));}
  finally{send.disabled=false;input.focus();}
}

function bindButtons(){
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeAuth();closeForm();closeDetails();closeHelp();closeManiMenu();}});
  byId("departments")?.addEventListener("click",e=>{const b=e.target.closest("[data-department]");if(b)setDepartment(b.dataset.department);});
  document.querySelector(".concept-one-dots")?.addEventListener("click",e=>{const dot=e.target.closest("[data-hero-slide]");if(dot)showHeroSlide(Number(dot.dataset.heroSlide));});
  byId("search")?.addEventListener("input",()=>{showListingResults();render();});byId("exploreSearch")?.addEventListener("input",()=>{renderExploreListings();if(exploreMode==="stores")renderExploreStores();});
  byId("storeForm")?.addEventListener("submit",createManiHubStore);byId("province")?.addEventListener("change",render);byId("listingForm")?.addEventListener("submit",publishListing);byId("photo")?.addEventListener("change",previewListingPhoto);
  ["item","price","category","seller","provinceInput","phone"].forEach(id=>{
    const input=byId(id);if(!input)return;
    const clear=()=>{input.setAttribute("aria-invalid","false");const error=input.closest(".field")?.querySelector(".field-error");if(error){error.hidden=true;error.textContent="";}};
    input.addEventListener("input",clear);input.addEventListener("change",clear);
  });
  byId("categories")?.addEventListener("click",e=>{const b=e.target.closest("[data-category]");if(b)setCat(b.dataset.category);});
  byId("listings")?.addEventListener("click",e=>{const d=e.target.closest("[data-details]");if(d)showDetails(d.dataset.details);const f=e.target.closest("[data-open-form]");if(f)openForm();});
  byId("modal")?.addEventListener("click",e=>{if(e.target.id==="modal")closeForm();});
  byId("detailsModal")?.addEventListener("click",e=>{if(e.target.id==="detailsModal")closeDetails();});
}
function loadSupabaseFallback(){
  if(window.supabase?.createClient)return Promise.resolve(true);
  const sources=[
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js",
    "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"
  ];
  return new Promise(async resolve=>{
    for(const src of sources){
      const loaded=await new Promise(done=>{
        const script=document.createElement("script");
        let settled=false,timer;
        const finish=ok=>{if(settled)return;settled=true;clearTimeout(timer);script.onload=null;script.onerror=null;done(ok&&!!window.supabase?.createClient);};
        timer=setTimeout(()=>{script.remove();finish(false);},12000);
        script.src=src;script.async=true;
        script.onload=()=>finish(true);
        script.onerror=()=>{script.remove();finish(false);};
        document.head.appendChild(script);
      });
      if(loaded){resolve(true);return;}
    }
    resolve(false);
  });
}
async function initManiHub(){
  bindButtons();render();restorePageFromUrl();setStatus("Starting ManiHub account connection…");
  try{if(!window.supabase?.createClient){const loaded=await loadSupabaseFallback();if(!loaded)throw new Error("The Supabase library could not load. Check your internet connection.");}
    supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;syncHeaderActions();setStatus(currentUser?`Signed in as ${currentUser.email}. You can publish adverts.`:"Sign in or create an account to publish adverts to the shared marketplace.");});
    await refreshAuth();if(currentUser){window.location.replace(new URL("marketplace/",window.location.href).href);return;}await refreshListings();await refreshListingPopularity();
  }catch(error){setStatus("ManiHub connection could not start: "+(error.message||error));const target=byId("listings");if(target)target.innerHTML=`<div class="empty">${esc(error.message||error)}</div>`;}
}
window.signUpUser=signUpUser;window.signInUser=signInUser;window.openAuth=openAuth;window.closeAuth=closeAuth;window.closeDetails=closeDetails;window.toggleAuthMode=toggleAuthMode;window.togglePasswordVisibility=togglePasswordVisibility;window.signOutUser=signOutUser;window.render=render;window.openForm=openForm;window.closeForm=closeForm;window.setCat=setCat;window.showDetails=showDetails;window.setDepartment=setDepartment;window.openExplorePage=openExplorePage;window.toggleListingSave=toggleListingSave;window.closeExplorePage=closeExplorePage;window.setExploreCategory=setExploreCategory;window.renderExploreListings=renderExploreListings;window.setExploreMode=setExploreMode;window.openStoreForm=openStoreForm;window.closeStoreForm=closeStoreForm;window.openStoreDetails=openStoreDetails;window.closeStoreDetails=closeStoreDetails;
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initManiHub,{once:true});else initManiHub();

</script>
